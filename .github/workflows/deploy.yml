# Build the static CyberDeck Radio app and publish it to GitHub Pages.
#
#   push to main ──▶ install ──▶ [scrape radio.garden] ──▶ vite build ──▶ dist/public
#   schedule (daily) ──▶  ...same pipeline, always with a fresh catalog...  │
#                        │                                                 │
#                        └────────────── upload-pages-artifact ◀───────────┘
#                                                  │
#                                                  ▼
#                                          deploy-pages ──▶ GitHub Pages
#
# The site is an org Pages site served at the domain root, so BASE_PATH is "/".
#
# Radio Garden's API is CORS-locked, so its directory is scraped here (Node, with
# a browser User-Agent to pass Cloudflare) and baked into public/ before the
# build. The result is cached per-day so ordinary pushes skip the crawl and only
# the scheduled run pays for it. The ~10 MB catalog is also gzipped so the app
# transports ~1 MB over the wire (the adapter decompresses it in-browser).

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 04:23 UTC — refresh the Radio Garden catalog.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute cache day
        id: cache-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Radio Garden catalog
        id: radio-garden-cache
        uses: actions/cache@v4
        with:
          path: artifacts/cyberdeck-radio/public/radio-garden.json
          key: radio-garden-data-${{ steps.cache-day.outputs.day }}
          restore-keys: |
            radio-garden-data-

      - name: Scrape Radio Garden
        if: steps.radio-garden-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm --filter @workspace/scripts run scrape:radio-garden

      - name: Compress Radio Garden catalog
        run: gzip -k -9 -f artifacts/cyberdeck-radio/public/radio-garden.json
        continue-on-error: true

      - name: Build
        run: pnpm --filter @workspace/cyberdeck-radio build
        env:
          PORT: "8080"
          BASE_PATH: "/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cyberdeck-radio/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
